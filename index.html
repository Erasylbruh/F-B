<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>JS Practice</title>
</head>
<body>
  <div class="tabs-nav">
    <h1 class="tab-btn tab-active">Lesson 1</h1>
    <h1 class="tab-btn">Lesson 2</h1>
    <h1 class="tab-btn">Lesson 3</h1>
    <h1 class="tab-btn">Lesson 4</h1>
    <h1 class="tab-btn">Lesson 5</h1>
  </div>

  <div class="tabs-content">
    <div class="les1 active-lesson">
      <p id="hworld">It'll appear here</p>
      <button id="hworld-btn">Press to show "Hello World"</button>
      <button id="mknewdiv">Press to make a new "div"</button>
      <p class="old-element">Im an old element</p>
      <button id="rmolde">Remove old element</button>
      <p id="chan-col">This is changable text (click here)</p>
    </div>

    <div class="les2">
      <p id="target" class="mba">This text can be activated (click here)</p>
      <p id="output">There they'll appear</p>
    </div>

    <div class="les3">
      <label>Rows: <input type="number" id="rows-input" value="3" min="1"></label>
      <label>Columns: <input type="number" id="cols-input" value="4" min="1"></label>
      <button id="gen-btn">Generate table</button>
      <div id="tableContainer"></div>
      <div class="stats">Selected: <b id="counter">0</b></div>
    </div>

    <div class="les4">
      <button id="chan-theme">Switch to Dark Theme</button>
    </div>

    <div class="les5">
      <div class="todo-top-bar">
        <span class="todo-title">Tasks</span>
        <button type="button" id="add-btn" class="btn-add-trigger" title="Add Task">+</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
    </div>
  </div>

  <div id="todo-popup" class="todo-popup" aria-hidden="true">
    <div class="todo-popup-content">
      <span class="todo-popup-icon" id="todo-popup-icon">✓</span>
      <p class="todo-popup-message" id="todo-popup-message">Notification</p>
      <button type="button" class="todo-popup-btn" id="todo-popup-close">OK</button>
    </div>
  </div>

  <div id="add-popup" class="add-popup" aria-hidden="true">
    <div class="add-popup-content">
      <h3 class="add-popup-title">Add Task</h3>
      <input type="text" id="add-task-input" class="add-task-input" placeholder="Enter task..." autocomplete="off">
      <div class="add-popup-actions">
        <button type="button" id="add-cancel-btn" class="add-btn-cancel">Cancel</button>
        <button type="button" id="add-save-btn" class="add-btn-save">Add</button>
      </div>
    </div>
  </div>
  
  <div id="edit-popup" class="edit-popup" aria-hidden="true">
    <div class="edit-popup-content">
      <h3 class="edit-popup-title">Edit Task</h3>
      <input type="text" id="edit-task-input" class="edit-task-input" placeholder="Enter task text..." autocomplete="off">
      <div class="edit-popup-actions">
        <button type="button" id="edit-cancel-btn" class="edit-btn-cancel">Cancel</button>
        <button type="button" id="edit-save-btn" class="edit-btn-save">Save</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
